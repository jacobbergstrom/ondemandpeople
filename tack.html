<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tack! · On Demand People</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-teal: #1a6b63;
            --petrol: #0d3d3d;
            --petrol-light: #8bc4bc;
            --amber: #d4a84b;
            --sand: #e8dfd0;
            --night: #1a1a2e;
            --cream: #faf8f5;
            --warm-gray: #6b6b6b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--night);
            color: var(--cream);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }

        .logo {
            margin-bottom: 48px;
        }

        .logo svg {
            width: 80px;
            height: 80px;
        }

        h1 {
            font-family: 'Fraunces', Georgia, serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 1.2rem;
            color: var(--sand);
            margin-bottom: 16px;
            max-width: 450px;
            line-height: 1.7;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 32px;
            padding: 16px 32px;
            background: var(--amber);
            color: var(--night);
            text-decoration: none;
            font-weight: 600;
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(212, 168, 75, 0.3);
        }

        .decor-ring {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 60px solid rgba(26, 107, 99, 0.08);
            top: -100px;
            right: -100px;
            pointer-events: none;
        }

        .decor-dot {
            position: fixed;
            width: 20px;
            height: 20px;
            background: var(--amber);
            border-radius: 50%;
            opacity: 0.4;
            bottom: 15%;
            left: 10%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="decor-ring"></div>
    <div class="decor-dot"></div>

    <div class="logo">
        <svg viewBox="0 0 100 100">
            <circle cx="40" cy="50" r="28" fill="none" stroke="#ffffff" stroke-width="12"/>
            <circle cx="78" cy="32" r="9" fill="#8bc4bc"/>
        </svg>
    </div>

    <h1>Tack!</h1>
    <p>Vi har mottagit ditt meddelande och återkommer så snart vi kan.</p>
    <p style="font-size: 1rem; color: var(--petrol-light);">Ser fram emot att prata med dig.</p>

    <a href="index.html" class="btn">
        ← Tillbaka till startsidan
    </a>
</body>
</html>
